<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>M2Manager</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />

    <!-- Bootstrap Icons (MIT) — warianty konturowe, bez -fill. -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="manifest.webmanifest" rel="manifest" />

    <!-- iOS: tryb pełnoekranowy po dodaniu do ekranu początkowego -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M2Manager" />
    <meta name="theme-color" content="#1f4e79" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>

    <!--
      Motyw ustawiamy przed pierwszym malowaniem strony. Gdyby robił to dopiero Blazor,
      przy trybie ciemnym mignąłby na ułamek sekundy jasny ekran.
    -->
    <script>
        window.m2theme = (function () {
            const KLUCZ = 'm2manager.theme';
            const media = window.matchMedia('(prefers-color-scheme: dark)');

            function zapisany() {
                try { return localStorage.getItem(KLUCZ) || 'auto'; } catch { return 'auto'; }
            }

            function zastosuj(tryb) {
                const efektywny = tryb === 'auto' ? (media.matches ? 'dark' : 'light') : tryb;
                document.documentElement.dataset.theme = efektywny;
            }

            // Zmiana ustawienia systemu ma skutkować od razu, ale tylko w trybie automatycznym.
            media.addEventListener('change', () => {
                if (zapisany() === 'auto') { zastosuj('auto'); }
            });

            zastosuj(zapisany());

            return {
                get: zapisany,
                set: function (tryb) {
                    try { localStorage.setItem(KLUCZ, tryb); } catch { /* tryb prywatny — trudno */ }
                    zastosuj(tryb);
                }
            };
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Wystąpił nieoczekiwany błąd.
        <a href="." class="reload">Odśwież</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="js/floorplan.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });
        }
    </script>
</body>

</html>
